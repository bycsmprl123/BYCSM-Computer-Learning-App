
name: Build BYCSM Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: unzip -o BYCSM_Flutter_Starter_v2_1.zip -d .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: BYCSM_Flutter_Starter
        run: flutter pub get

      - name: Build APK
        working-directory: BYCSM_Flutter_Starter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYCSM-Android-APK
          path: BYCSM_Flutter_Starter/build/app/outputs/flutter-apk/app-debug.apk
